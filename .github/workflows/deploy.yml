# Despliegue en el servidor Ubuntu en cada push a main, después de que pasen
# las pruebas. Corre en el runner auto-hospedado del servidor (como los demás
# proyectos): actualiza la copia de /opt/tasktime y reconstruye los contenedores.
#
# No necesita secretos. El .env del servidor se crea una sola vez con
# deploy/instalar_servidor.sh y nunca viaja por GitHub. Si el repositorio vive
# en otra ruta, define la variable DEPLOY_PATH en
# Settings > Secrets and variables > Actions > Variables.
name: desplegar

on:
  push:
    branches: ["main"]

concurrency:
  group: despliegue-tasktime
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  desplegar:
    needs: pruebas
    runs-on: self-hosted
    steps:
      - name: Actualizar código y reconstruir contenedores
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/tasktime' }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f .env || { echo "Falta $DEPLOY_PATH/.env: corre deploy/instalar_servidor.sh una vez."; exit 1; }
          git fetch --all --prune
          git reset --hard origin/main
          docker compose build --pull
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps
