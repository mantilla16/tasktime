<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Russell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --paper:#F4F4F3; --surface:#FFFFFF; --surface-2:#F7F7F6; --surface-hover:#EFEFEE;
    --ink:#1E1E1F; --ink-soft:#63636A; --ink-faint:#94949A;
    --line:#E2E2E1; --line-strong:#CBCBC9;
    --accent:#33363C; --accent-contrast:#FFFFFF; --accent-soft:#ECECED;
    --shadow: 0 1px 2px rgba(20,20,21,0.07), 0 10px 28px rgba(20,20,21,0.10);
    --good:#0ca30c; --warning:#c98100; --serious:#c85a34; --critical:#d03b3b;
    --good-bg:#e6f6e6; --warning-bg:#fdf1da; --serious-bg:#fbe6dd; --critical-bg:#fbe3e2;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#c98500;
    --cat-5:#e87ba4; --cat-6:#1a8f1a; --cat-7:#4a3aa7; --cat-8:#e34948;
    --ord-0:#F1F1F0; --ord-1:#cfe0f7; --ord-2:#86b6ef; --ord-3:#3987e5; --ord-4:#1c5cab; --ord-5:#d03b3b;
    /* fases del presupuesto (fondo / texto) */
    --ph-previas-bg:#dbe9fb;      --ph-previas-fg:#1c4f8f;
    --ph-planeacion-bg:#d9f2e3;   --ph-planeacion-fg:#176a3a;
    --ph-ejecucion-bg:#f6d9f0;    --ph-ejecucion-fg:#8a2b74;
    --ph-cierre-bg:#c9f1ec;       --ph-cierre-fg:#0f6b63;
    --ph-informe-bg:#fde7c4;      --ph-informe-fg:#8a5200;
    --ph-vacaciones-bg:#ffd9d2;   --ph-vacaciones-fg:#9a3520;
    --ph-compensatorio-bg:#fff4a8;--ph-compensatorio-fg:#6b5a00;
    --ph-especiales-bg:#e6def8;   --ph-especiales-fg:#4b2f9a;
    --ph-none-bg:#ECECEB;         --ph-none-fg:#4a4a50;
    --radius-s:8px; --radius-m:12px; --radius-l:18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:#18181B; --surface:#212124; --surface-2:#262629; --surface-hover:#2C2C30;
      --ink:#F2F2F1; --ink-soft:#B9B9BE; --ink-faint:#86868C;
      --line:#333338; --line-strong:#45454B;
      --accent:#C7C9D1; --accent-contrast:#1B1B1E; --accent-soft:#313136;
      --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 12px 30px rgba(0,0,0,0.5);
      --good:#3fcf3f; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
      --good-bg:#12301a; --warning-bg:#3a2b0c; --serious-bg:#3a2015; --critical-bg:#3a1717;
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
      --cat-5:#d55181; --cat-6:#3fcf3f; --cat-7:#9085e9; --cat-8:#e66767;
      --ord-0:#2a2a2e; --ord-1:#1f3550; --ord-2:#24507f; --ord-3:#2a78d6; --ord-4:#6da7ec; --ord-5:#e66767;
      --ph-previas-bg:#1e3350;      --ph-previas-fg:#9cc3f2;
      --ph-planeacion-bg:#163826;   --ph-planeacion-fg:#8fd8a8;
      --ph-ejecucion-bg:#45213d;    --ph-ejecucion-fg:#eaa6d9;
      --ph-cierre-bg:#113a36;       --ph-cierre-fg:#8de0d6;
      --ph-informe-bg:#3f2d0c;      --ph-informe-fg:#f4c46b;
      --ph-vacaciones-bg:#45211a;   --ph-vacaciones-fg:#f4a391;
      --ph-compensatorio-bg:#3d3608;--ph-compensatorio-fg:#efe07a;
      --ph-especiales-bg:#2d2250;   --ph-especiales-fg:#c3b4f3;
      --ph-none-bg:#2b2b2f;         --ph-none-fg:#c8c8cc;
    }
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-variant-numeric: tabular-nums; }
  h1,h2,h3{ font-family:"Fraunces", Georgia, "Times New Roman", serif; font-weight:600; text-wrap:balance; margin:0; }
  p{ margin:0; }
  button{ font:inherit; color:inherit; }
  input,select,textarea{ font:inherit; color:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  svg{ display:inline-block; }

  #root{ display:flex; min-height:100vh; }

  /* ---------- Acceso ---------- */
  .auth-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .auth-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); padding:30px 30px 26px; width:100%; max-width:420px; box-shadow:var(--shadow); }
  .auth-card .brand{ margin-bottom:22px; }
  .auth-card h1{ font-size:22px; margin-bottom:4px; }
  .auth-card .lead{ font-size:13.5px; color:var(--ink-soft); margin-bottom:18px; }
  .auth-card .btn-accent{ width:100%; padding:11px; margin-top:4px; }
  .auth-error{ background:var(--critical-bg); color:var(--critical); border-radius:var(--radius-s); padding:9px 12px; font-size:13px; margin-bottom:12px; }
  .auth-foot{ margin-top:16px; font-size:12px; color:var(--ink-faint); line-height:1.5; }

  /* ---------- Rail ---------- */
  .rail{
    width:236px; flex:none; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 16px; gap:18px; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 4px; }
  .brand-mark{
    width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-contrast);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-name{ font-family:"Fraunces", serif; font-weight:600; font-size:20px; letter-spacing:-0.01em; line-height:1.1; }
  .brand-sub{ font-size:11px; color:var(--ink-faint); }

  .btn-new{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--accent); color:var(--accent-contrast); border:none; border-radius:var(--radius-s);
    padding:10px 14px; font-weight:600; font-size:14px; cursor:pointer; transition:opacity .15s ease;
  }
  .btn-new:hover{ opacity:.88; }
  .btn-new svg{ width:15px; height:15px; }

  nav.rail-nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-s);
    border:none; background:transparent; color:var(--ink-soft); font-size:14px; font-weight:500;
    cursor:pointer; text-align:left; width:100%;
  }
  .nav-item svg{ width:17px; height:17px; flex:none; opacity:.85; }
  .nav-item:hover{ background:var(--surface-hover); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav-count{ margin-left:auto; font-size:11.5px; color:var(--ink-faint); font-family:"IBM Plex Mono", monospace; }
  .nav-item.active .nav-count{ color:var(--accent); }

  .rail-foot{ margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .rail-user{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:var(--radius-s); background:var(--surface-2); border:1px solid var(--line); }
  .rail-user-info{ min-width:0; flex:1; }
  .rail-user-name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rail-user-role{ font-size:11px; color:var(--ink-faint); }
  .rail-badge{ font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; padding:0 4px; }
  .rail-badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--good); }
  .rail-badge .dot.off{ background:var(--ink-faint); }

  /* ---------- Vista ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; gap:14px; padding:18px 28px 14px; border-bottom:1px solid var(--line);
    background:var(--paper); position:sticky; top:0; z-index:10;
  }
  .topbar h1{ font-size:22px; }
  .topbar .sub{ font-size:12.5px; color:var(--ink-faint); margin-top:1px; }
  .topbar-actions{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .search-wrap{ position:relative; width:240px; }
  .search-wrap svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint); }
  .search-wrap input{
    width:100%; padding:8px 10px 8px 32px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); font-size:13.5px;
  }
  .search-wrap input:focus{ border-color:var(--accent); }
  .view-body{ padding:22px 28px 60px; flex:1; }
  .view-toggle{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface); }
  .view-toggle button{ border:none; background:none; padding:7px 12px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:6px; }
  .view-toggle button svg{ width:14px; height:14px; }
  .view-toggle button.active{ background:var(--accent-soft); color:var(--accent); }

  /* ---------- Toast ---------- */
  .toast-stack{ position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:100; }
  .toast{
    background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:var(--radius-s);
    font-size:13.5px; box-shadow:var(--shadow); max-width:360px; animation: toast-in .18s ease;
  }
  .toast.err{ background:var(--critical); color:#fff; }
  .toast.ok{ background:#1c5f2c; color:#fff; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ---------- Chips ---------- */
  .chip{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .chip-client{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); max-width:200px; overflow:hidden; text-overflow:ellipsis; display:inline-block; }
  .prio-alta{ background:var(--critical-bg); color:var(--critical); }
  .prio-media{ background:var(--warning-bg); color:var(--warning); }
  .prio-baja{ background:var(--good-bg); color:var(--good); }
  .role-pill{ font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); }
  .role-pill.junior{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }
  .role-pill.gerente{ background:var(--ink); color:var(--paper); }
  .ph{ background:var(--ph-none-bg); color:var(--ph-none-fg); }
  .ph-previas{ background:var(--ph-previas-bg); color:var(--ph-previas-fg); }
  .ph-planeacion{ background:var(--ph-planeacion-bg); color:var(--ph-planeacion-fg); }
  .ph-ejecucion{ background:var(--ph-ejecucion-bg); color:var(--ph-ejecucion-fg); }
  .ph-cierre{ background:var(--ph-cierre-bg); color:var(--ph-cierre-fg); }
  .ph-informe{ background:var(--ph-informe-bg); color:var(--ph-informe-fg); }
  .ph-vacaciones{ background:var(--ph-vacaciones-bg); color:var(--ph-vacaciones-fg); }
  .ph-compensatorio{ background:var(--ph-compensatorio-bg); color:var(--ph-compensatorio-fg); }
  .ph-especiales{ background:var(--ph-especiales-bg); color:var(--ph-especiales-fg); }

  .avatar{
    width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex:none;
  }
  .avatar.lg{ width:40px; height:40px; font-size:15px; }
  .assignee{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); }
  .assignee.unassigned{ color:var(--ink-faint); font-style:italic; }

  /* ---------- Kanban ---------- */
  .board{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; align-items:start; }
  .col{ background:var(--surface-2); border-radius:var(--radius-m); border:1px solid var(--line); min-height:120px; }
  .col-head{ display:flex; align-items:center; gap:8px; padding:14px 14px 10px; }
  .col-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .col-name{ font-weight:600; font-size:13.5px; }
  .col-count{ margin-left:auto; font-size:12px; color:var(--ink-faint); font-family:"IBM Plex Mono", monospace; }
  .col-cards{ display:flex; flex-direction:column; gap:10px; padding:0 10px 14px; min-height:60px; }
  .col-cards.drag-over{ background:var(--accent-soft); border-radius:var(--radius-s); }
  .col-empty{ font-size:12px; color:var(--ink-faint); padding:10px 4px; text-align:center; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s);
    padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:9px; box-shadow:0 1px 1px rgba(0,0,0,.02);
    transition: border-color .12s ease;
  }
  .card:hover{ border-color:var(--line-strong); }
  .card.dragging{ opacity:.4; }
  .card-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .card-title{ font-size:13.5px; font-weight:600; line-height:1.35; }
  .card-meta{ display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--ink-faint); flex-wrap:wrap; }
  .card-meta .item{ display:flex; align-items:center; gap:4px; }
  .card-meta svg{ width:12px; height:12px; }
  .due.overdue{ color:var(--critical); font-weight:600; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  /* ---------- Filtros / tablas ---------- */
  .filters-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .filters-row select, select.sm{
    border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-s);
    padding:7px 26px 7px 10px; font-size:12.5px; color:var(--ink-soft);
    appearance:none; -webkit-appearance:none; max-width:220px;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="%2394949A" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>');
    background-repeat:no-repeat; background-position:right 9px center;
  }
  .filters-row select:hover{ border-color:var(--line-strong); }
  .filters-clear{ font-size:12.5px; color:var(--accent); background:none; border:none; cursor:pointer; padding:7px 4px; font-weight:600; }

  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); }
  table.data{ width:100%; border-collapse:collapse; min-width:720px; }
  .data th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);
    font-weight:600; padding:11px 14px; border-bottom:1px solid var(--line); user-select:none;
    background:var(--surface-2); white-space:nowrap;
  }
  .data td{ padding:11px 14px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle; }
  .data tr:last-child td{ border-bottom:none; }
  .data tbody tr.clickable{ cursor:pointer; }
  .data tbody tr.clickable:hover{ background:var(--surface-hover); }
  .data td.num, .data th.num{ text-align:right; font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; }
  .status-pill{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap; }
  .muted{ color:var(--ink-faint); }
  .small{ font-size:12px; }

  /* ---------- Vacío ---------- */
  .empty-state{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:60px 20px; color:var(--ink-faint); }
  .empty-state svg{ width:40px; height:40px; opacity:.5; margin-bottom:4px; }
  .empty-state h3{ color:var(--ink-soft); font-size:17px; }
  .empty-state p{ max-width:380px; font-size:13.5px; }
  .empty-state .btn-new{ width:auto; margin-top:6px; }

  /* ---------- Panel ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; cursor:pointer; }
  .stat-tile:hover{ border-color:var(--line-strong); }
  .stat-label{ font-size:12px; color:var(--ink-faint); font-weight:500; }
  .stat-value{ font-size:30px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .stat-value.crit{ color:var(--critical); }
  .stat-sub{ font-size:11.5px; color:var(--ink-faint); }
  .panel-grid{ display:grid; grid-template-columns:1.2fr 1fr; gap:16px; align-items:start; }
  @media (max-width:980px){ .panel-grid{ grid-template-columns:1fr; } }
  .chart-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px; }
  .chart-card h3{ font-size:14.5px; margin-bottom:4px; }
  .chart-card .hint{ font-size:12px; color:var(--ink-faint); margin-bottom:14px; }
  .bar-row{ display:grid; grid-template-columns:130px 1fr 72px; align-items:center; gap:10px; margin-bottom:11px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-label{ font-size:12.5px; color:var(--ink-soft); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{ height:16px; background:var(--surface-2); border-radius:4px; overflow:hidden; position:relative; }
  .bar-fill{ height:100%; border-radius:4px; min-width:3px; background:var(--ord-3); }
  .bar-fill.over{ background:var(--ord-5); }
  .bar-value{ font-size:12px; color:var(--ink-faint); font-family:"IBM Plex Mono", monospace; text-align:right; white-space:nowrap; }
  .legend-row{ display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .legend-item .sw{ width:12px; height:12px; border-radius:3px; flex:none; }
  .upcoming-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .upcoming-row:last-child{ border-bottom:none; }
  .upcoming-row:hover .card-title{ color:var(--accent); }
  .upcoming-date{ font-size:11.5px; font-family:"IBM Plex Mono", monospace; color:var(--ink-faint); width:70px; flex:none; }
  .upcoming-date.overdue{ color:var(--critical); font-weight:600; }

  /* ---------- Equipo ---------- */
  .people-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-bottom:26px; }
  .person-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .person-card:hover{ border-color:var(--line-strong); }
  .person-card.inactive{ opacity:.55; }
  .person-info{ min-width:0; flex:1; }
  .person-name{ font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .person-email{ font-size:12px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person-stats{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; }
  .person-actions{ display:flex; gap:4px; margin-left:auto; flex:none; }
  .icon-btn{
    width:26px; height:26px; border-radius:7px; border:1px solid transparent; background:none; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  .icon-btn svg{ width:14px; height:14px; }
  .icon-btn:hover{ background:var(--surface-hover); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--critical-bg); color:var(--critical); }

  /* ---------- Cuadrículas semanales (presupuesto y carga) ---------- */
  .grid-wrap{ overflow:auto; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); max-height:calc(100vh - 230px); }
  table.wgrid{ border-collapse:separate; border-spacing:0; font-size:12px; }

  .load-0{ background:var(--ord-0); }

  .week-summary{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-bottom:18px; }

  /* ---------- Formularios ---------- */
  .panel-form{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px; max-width:560px; margin-bottom:16px; }

  label.field-label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],textarea,select.field{
    border:1px solid var(--line); border-radius:var(--radius-s); padding:9px 11px; background:var(--surface);
    font-size:13.5px; width:100%;
  }
  input:focus,textarea:focus,select.field:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; min-height:64px; font-family:inherit; }
  .btn{ border-radius:var(--radius-s); padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--surface); }

  .btn svg{ width:14px; height:14px; vertical-align:-2px; margin-right:5px; }
  .readonly-field{ font-size:13.5px; padding:8px 0; }
  .kv{ display:grid; grid-template-columns:140px 1fr; gap:6px 12px; font-size:13.5px; }
  .kv dt{ color:var(--ink-faint); font-size:12.5px; }
  .kv dd{ margin:0; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,12,17,0.44); display:flex; align-items:flex-start; justify-content:center;
    padding:5vh 16px; overflow-y:auto; z-index:50; backdrop-filter:blur(1.5px);
  }
  .modal{ background:var(--surface); border-radius:var(--radius-l); width:100%; max-width:580px; box-shadow:var(--shadow); display:flex; flex-direction:column; max-height:90vh; }
  .modal.narrow{ max-width:420px; }
  .modal-head{ display:flex; align-items:center; gap:10px; padding:20px 22px 14px; border-bottom:1px solid var(--line); }
  .modal-head h2{ font-size:18px; flex:1; }

  .modal-close svg{ width:16px; height:16px; }
  .modal-body{ padding:18px 22px; overflow-y:auto; }
  .modal-foot{ display:flex; align-items:center; gap:10px; padding:14px 22px 20px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .modal-foot .spacer{ flex:1; }
  .segmented{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg-btn{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .seg-btn .dot{ width:7px; height:7px; border-radius:50%; }
  .seg-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .section-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin:18px 0 8px; }

  .comment{ display:flex; gap:9px; padding:10px 0; border-bottom:1px solid var(--line); }
  .comment:last-child{ border-bottom:none; }
  .comment-body{ flex:1; min-width:0; }
  .comment-head{ display:flex; align-items:baseline; gap:8px; }
  .comment-author{ font-size:12.5px; font-weight:600; }
  .comment-time{ font-size:11px; color:var(--ink-faint); }
  .comment-text{ font-size:13px; color:var(--ink-soft); margin-top:2px; white-space:pre-wrap; word-break:break-word; }
  .comment-empty{ font-size:12.5px; color:var(--ink-faint); padding:6px 0; }
  .add-row{ display:flex; gap:8px; margin-top:6px; }
  .add-row textarea{ flex:1; min-height:44px; }
  .notify-box{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-s); padding:12px 13px; display:flex; flex-direction:column; gap:8px; font-size:12.5px; }
  .notify-status{ display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; }
  .notify-status.ok{ color:var(--good); }
  .notify-status.err{ color:var(--critical); }
  .notify-status.pending{ color:var(--ink-faint); }
  .muted-note{ font-size:11.5px; color:var(--ink-faint); }
  .settings-panel code{ font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--surface-hover); padding:1px 5px; border-radius:4px; }
  .sender-account{ display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .pw-box{ background:var(--warning-bg); border:1px solid var(--warning); border-radius:var(--radius-s); padding:12px 14px; font-size:13px; }
  .pw-box .pw{ font-family:"IBM Plex Mono", monospace; font-size:16px; font-weight:600; margin:6px 0; user-select:all; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .checkbox-row input{ width:16px; height:16px; accent-color:var(--accent); }
  .hours-bar{ height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-top:4px; }
  .hours-bar i{ display:block; height:100%; background:var(--ord-3); border-radius:3px; }
  .hours-bar i.over{ background:var(--ord-5); }

  @media (max-width: 880px){
    #root{ flex-direction:column; }

    .btn-new{ width:auto; flex:none; padding:9px 12px; }

    .view-body{ padding:14px 16px; }
    .search-wrap{ width:100%; }
    .grid-wrap{ max-height:none; }
    .kv{ grid-template-columns:1fr; }
  }
</style>
</head>
