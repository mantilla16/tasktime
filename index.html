<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Horas por cliente · Russell Bedford</title>
<link rel="icon" href="assets/logo-rb-azul.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* Solo layout y componentes propios; todos los colores salen de assets/tokens.css */
  :root{
    --ph-previas:        var(--rb-azul-20);
    --ph-planeacion:     var(--rb-turquesa-20);
    --ph-ejecucion:      var(--rb-jade-40);
    --ph-cierre:         var(--rb-azul-40);
    --ph-informe:        var(--rb-naranja-20);
    --ph-vacaciones:     var(--rb-gris-40);
    --ph-compensatorio:  var(--rb-naranja-40);
    --ph-especiales:     var(--rb-morado-20);
    --ph-none:           var(--rb-gris-20);
    --ancho-app: 1480px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ph-previas: #33467a; --ph-planeacion: #1a5a7a; --ph-ejecucion: #1a7a74; --ph-cierre: #4b5a8a;
      --ph-informe: #7a5218; --ph-vacaciones: #4a4e6a; --ph-compensatorio: #9a6a1a; --ph-especiales: #5a2a60; --ph-none: #2a3a7a;
    }
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ min-height:100%; }
  body{ display:flex; flex-direction:column; min-height:100vh; font-size:15px; color:var(--rb-texto-cuerpo); background:var(--rb-gris-10); }
  .rb-tarjeta, .rb-kpi{ background:var(--rb-blanco); }
  button{ font:inherit; }
  input,select,textarea{ font:inherit; }
  #root{ flex:1; display:flex; flex-direction:column; }
  .app{ flex:1; display:flex; flex-direction:column; }
  h1,h2,h3{ margin:0; }
  h1{ font-size:1.9rem; }
  h2{ font-size:1.15rem; }
  h3{ font-size:1rem; }
  p{ margin:0; }
  .sec{ color:var(--rb-texto-2); font-size:.875rem; }
  .az{ color:var(--rb-texto); }
  .b{ font-weight:700; }
  .num{ font-variant-numeric:tabular-nums; }

  /* ---------- Cabecera: logo arriba a la izquierda ---------- */
  .rb-header{ padding:14px var(--rb-margen); gap:16px; position:sticky; top:0; z-index:20; background:var(--rb-blanco); }
  .rb-logo{ width:168px; height:56px; margin:0 24px 0 0; flex:none; }
  .nav{ display:flex; gap:4px; flex:1; min-width:0; overflow-x:auto; }
  .nav button{
    border:0; background:none; color:var(--rb-texto); font-weight:700; font-size:.95rem; padding:10px 14px;
    border-radius:var(--rb-radio-pildora); cursor:pointer; white-space:nowrap;
  }
  .nav button:hover{ background:var(--rb-azul-10); }
  .nav button.activo{ background:var(--rb-azul-10); color:var(--rb-azul); box-shadow:inset 0 -2px 0 var(--rb-jade); }
  .usuario{ display:flex; align-items:center; gap:10px; flex:none; }
  .usuario .nombre{ font-weight:700; color:var(--rb-texto); font-size:.9rem; line-height:1.2; }
  .usuario .rol{ font-size:.78rem; color:var(--rb-texto-2); }
  .avatar{ width:32px; height:32px; border-radius:50%; background:var(--rb-azul-10); color:var(--rb-azul); display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; flex:none; }
  .avatar.sm{ width:26px; height:26px; font-size:.7rem; }
  .avatar.azul{ background:var(--rb-azul); color:var(--rb-blanco); }
  .avatar.gris{ background:var(--rb-gris-20); color:var(--rb-azul-80); }
  .icono-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--rb-borde); background:none; color:var(--rb-texto); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .icono-btn:hover{ background:var(--rb-azul-10); }
  .icono-btn svg{ width:16px; height:16px; }

  /* ---------- Contenido ---------- */
  main.contenido{ flex:1; width:100%; max-width:var(--ancho-app); margin:0 auto; padding:28px var(--rb-margen) 48px; }
  .titulo-fila{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .titulo-fila h1{ font-weight:300; font-style:italic; color:var(--rb-texto); }
  .titulo-fila h1 b{ font-weight:700; }
  .titulo-fila .sub{ margin-top:4px; }
  .acciones{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .rb-btn{ padding:10px 18px; font-size:.9rem; }
  .rb-btn svg{ width:15px; height:15px; }
  .rb-btn--sm{ padding:7px 14px; font-size:.85rem; }
  .rb-btn--texto{ background:none; color:var(--rb-texto); border-color:transparent; padding:8px 10px; }
  .rb-btn--texto:hover{ background:var(--rb-azul-10); }
  .rb-btn--peligro{ background:none; color:var(--rb-error); border-color:transparent; }
  .rb-btn--peligro:hover{ background:var(--rb-morado-10); }
  .rb-select, .rb-input{ padding:9px 12px; font-size:.95rem; }
  .rb-select{ appearance:none; -webkit-appearance:none; padding-right:34px;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%23939598" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>');
    background-repeat:no-repeat; background-position:right 12px center; }
  .filtros{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .filtros .rb-select{ width:auto; min-width:180px; }

  /* Selector de semana */
  .semana-sel{ display:flex; align-items:center; gap:6px; }
  .semana-sel .rb-select{ min-width:260px; }

  /* KPI */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:24px; }
  .rb-kpi{ padding:16px 20px; }
  .rb-kpi .valor{ font-size:1.8rem; }
  .rb-kpi .valor small{ font-size:.9rem; font-weight:400; color:var(--rb-texto-2); }
  .rb-kpi.aviso{ border-top:4px solid var(--rb-naranja); }
  .rb-kpi.ok{ border-top:4px solid var(--rb-jade); }

  /* Tarjetas por persona (asignación semanal) */
  .personas-semana{ display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; }
  .persona-card{ padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .persona-head{ display:flex; align-items:center; gap:12px; }
  .persona-head .nombre{ font-weight:700; color:var(--rb-texto); }
  .persona-head .meta{ font-size:.8rem; color:var(--rb-texto-2); }
  .persona-head .total{ margin-left:auto; text-align:right; }
  .persona-head .total .h{ font-size:1.35rem; font-weight:700; color:var(--rb-texto); line-height:1.1; }
  .persona-head .total .h.sobre{ color:var(--rb-naranja); }
  .persona-head .total .c{ font-size:.75rem; color:var(--rb-texto-2); }
  .barra{ height:8px; background:var(--rb-gris-20); border-radius:4px; overflow:hidden; }
  .barra i{ display:block; height:100%; background:var(--rb-jade); border-radius:4px; min-width:2px; }
  .barra i.medio{ background:var(--rb-turquesa); }
  .barra i.alto{ background:var(--rb-azul); }
  .barra i.sobre{ background:var(--rb-naranja); }
  .lineas{ display:flex; flex-direction:column; }
  .linea{ display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--rb-gris-20); font-size:.92rem; }
  .linea:last-child{ border-bottom:none; }
  .linea.editable{ cursor:pointer; border-radius:6px; }
  .linea.editable:hover{ background:var(--rb-gris-10); }
  .linea .cli{ color:var(--rb-texto); font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .linea .nota{ display:block; font-weight:400; color:var(--rb-texto-2); font-size:.8rem; white-space:normal; }
  .linea .hrs{ font-weight:700; color:var(--rb-texto); min-width:48px; text-align:right; }
  .linea-vacia{ color:var(--rb-texto-2); font-size:.875rem; padding:8px 0; }
  .persona-card .rb-btn{ align-self:flex-start; }

  /* Fases */
  .ph{ display:inline-block; padding:3px 10px; border-radius:var(--rb-radio-pildora); font-size:.75rem; font-weight:700; color:var(--rb-texto); background:var(--ph-none); white-space:nowrap; }
  .ph-previas{ background:var(--ph-previas); } .ph-planeacion{ background:var(--ph-planeacion); }
  .ph-ejecucion{ background:var(--ph-ejecucion); } .ph-cierre{ background:var(--ph-cierre); }
  .ph-informe{ background:var(--ph-informe); } .ph-vacaciones{ background:var(--ph-vacaciones); }
  .ph-compensatorio{ background:var(--ph-compensatorio); } .ph-especiales{ background:var(--ph-especiales); }
  .leyenda{ display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:14px; font-size:.8rem; color:var(--rb-texto-2); }
  .leyenda span{ display:inline-flex; align-items:center; gap:6px; }
  .leyenda i{ width:14px; height:14px; border-radius:4px; display:inline-block; }

  /* ---------- Cuadrículas semanales ---------- */
  .cuadricula{ overflow:auto; border:1px solid var(--rb-borde); border-radius:var(--rb-radio); background:var(--rb-blanco); max-height:calc(100vh - 250px); }
  table.wgrid{ border-collapse:separate; border-spacing:0; font-size:.8rem; }
  .wgrid th, .wgrid td{ border-right:1px solid var(--rb-gris-20); border-bottom:1px solid var(--rb-gris-20); padding:0; white-space:nowrap; }
  .wgrid thead th{ position:sticky; z-index:3; background:var(--rb-azul); color:var(--rb-blanco); font-weight:700; text-align:center; border-color:var(--rb-azul-80); }
  .wgrid thead tr:nth-child(1) th{ top:0; padding:7px 8px; font-size:.82rem; }
  .wgrid thead tr:nth-child(2) th{ top:31px; padding:4px 6px; font-size:.72rem; font-weight:400; }
  .wgrid thead tr:nth-child(3) th{ top:53px; padding:3px 6px; font-size:.72rem; font-weight:400; color:var(--rb-azul-20); }
  .wgrid th.fijo, .wgrid td.fijo{ position:sticky; left:0; z-index:2; text-align:left; padding:6px 12px; background:var(--rb-superficie); }
  .wgrid th.fijo2, .wgrid td.fijo2{ position:sticky; left:var(--fijo-w,210px); z-index:2; text-align:left; padding:6px 12px; background:var(--rb-superficie); border-right:2px solid var(--rb-borde); }
  .wgrid thead th.fijo, .wgrid thead th.fijo2{ z-index:4; background:var(--rb-azul); }
  .wgrid td.fijo{ font-weight:700; color:var(--rb-texto); max-width:210px; overflow:hidden; text-overflow:ellipsis; }
  .wgrid td.fijo2{ color:var(--rb-texto); }
  .wgrid td.celda{ width:54px; min-width:54px; height:32px; text-align:center; font-weight:700; color:var(--rb-texto); }
  .wgrid td.celda span{ display:block; padding:7px 4px; }
  .wgrid td.celda.editable{ cursor:pointer; }
  .wgrid td.celda.editable:hover{ outline:2px solid var(--rb-turquesa); outline-offset:-2px; }
  .wgrid .actual{ box-shadow:inset 0 0 0 2px var(--rb-jade); }
  .wgrid th.actual-h{ background:var(--rb-jade) !important; color:var(--rb-azul) !important; }
  .wgrid th.editable-h{ cursor:pointer; }
  .wgrid th.editable-h:hover{ background:var(--rb-azul-oscuro); }
  .wgrid td.total, .wgrid th.total{ position:sticky; right:0; z-index:2; text-align:right; padding:6px 12px; font-weight:700; background:var(--rb-azul-10); color:var(--rb-texto); border-left:2px solid var(--rb-borde); }
  .wgrid thead th.total{ background:var(--rb-azul); color:var(--rb-blanco); z-index:4; }
  .carga-0{ background:var(--rb-superficie); }
  .carga-1{ background:var(--rb-azul-20); }
  .carga-2{ background:var(--rb-azul-40); }
  .carga-3{ background:var(--rb-azul-60); color:var(--rb-blanco) !important; }
  .carga-4{ background:var(--rb-azul); color:var(--rb-blanco) !important; }
  .carga-sobre{ background:var(--rb-naranja); color:var(--rb-blanco) !important; }

  /* ---------- Tablas ---------- */
  .tabla-wrap{ overflow-x:auto; border:1px solid var(--rb-borde); border-radius:var(--rb-radio); background:var(--rb-blanco); }
  .rb-tabla td{ background:var(--rb-blanco); }
  .rb-tabla{ font-size:.92rem; min-width:720px; }
  .rb-tabla th{ font-size:.82rem; }
  .rb-tabla td.num, .rb-tabla th.num{ text-align:right; }
  .rb-tabla td .persona{ display:inline-flex; align-items:center; gap:8px; margin:2px 10px 2px 0; }
  .rb-tabla tr.inactivo td{ color:var(--rb-texto-2); }

  /* Equipo */
  .equipo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin-bottom:26px; }
  .equipo-card{ padding:16px 18px; display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .equipo-card:hover{ border-color:var(--rb-turquesa); }
  .equipo-card.inactivo{ opacity:.55; }
  .equipo-card .nombre{ font-weight:700; color:var(--rb-texto); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .equipo-card .correo{ font-size:.8rem; color:var(--rb-texto-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .equipo-card .stats{ font-size:.82rem; color:var(--rb-texto-cuerpo); margin-top:6px; display:flex; gap:12px; flex-wrap:wrap; }
  .rol{ display:inline-block; padding:2px 9px; border-radius:var(--rb-radio-pildora); font-size:.72rem; font-weight:700; background:var(--rb-azul-10); color:var(--rb-texto); }
  .rol.gerente{ background:var(--rb-azul); color:var(--rb-blanco); }
  .rol.senior{ background:var(--rb-jade-20); }
  .rol.junior{ background:var(--rb-gris-20); }
  .estado{ display:inline-block; padding:2px 9px; border-radius:var(--rb-radio-pildora); font-size:.75rem; font-weight:700; }
  .estado.ok{ background:var(--rb-jade-20); color:var(--rb-texto); }
  .estado.aviso{ background:var(--rb-naranja-20); color:var(--rb-texto); }
  .estado.gris{ background:var(--rb-gris-20); color:var(--rb-texto); }

  /* ---------- Acceso ---------- */
  .acceso{ flex:1; display:flex; align-items:center; justify-content:center; padding:32px var(--rb-margen); }
  .acceso .rb-tarjeta{ width:100%; max-width:440px; padding:32px; }
  .acceso .rb-logo{ margin:0 0 22px; }
  .acceso h1{ font-weight:300; font-style:italic; font-size:1.7rem; margin-bottom:6px; }
  .acceso h1 b{ font-weight:700; }
  .acceso .lead{ margin-bottom:18px; }
  .acceso .rb-btn{ width:100%; justify-content:center; margin-top:6px; }
  .campo{ margin-bottom:14px; }
  .campo.inline{ display:flex; gap:12px; flex-wrap:wrap; }
  .campo.inline > div{ flex:1; min-width:140px; }
  .check{ display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--rb-texto-cuerpo); }
  .check input{ width:16px; height:16px; accent-color:var(--rb-jade); }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(0,24,113,.55); display:flex; align-items:flex-start; justify-content:center; padding:6vh 16px; overflow-y:auto; z-index:50; }
  .modal{ width:100%; max-width:520px; padding:0; display:flex; flex-direction:column; max-height:88vh; }
  .modal.ancho{ max-width:640px; }
  .modal-head{ display:flex; align-items:center; gap:12px; padding:20px 24px 14px; border-bottom:1px solid var(--rb-gris-20); }
  .modal-head h2{ flex:1; font-size:1.2rem; }
  .modal-body{ padding:18px 24px; overflow-y:auto; }
  .modal-foot{ display:flex; align-items:center; gap:10px; padding:14px 24px 20px; border-top:1px solid var(--rb-gris-20); flex-wrap:wrap; }
  .modal-foot .esp{ flex:1; }
  .modal .cerrar{ border:0; background:none; color:var(--rb-texto-2); cursor:pointer; width:32px; height:32px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; }
  .modal .cerrar:hover{ background:var(--rb-azul-10); color:var(--rb-texto); }
  .modal .cerrar svg{ width:16px; height:16px; }
  .segmentos{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg{ border:1.5px solid var(--rb-gris-40); background:none; color:var(--rb-texto); border-radius:var(--rb-radio-pildora); padding:6px 14px; font-size:.85rem; font-weight:700; cursor:pointer; }
  .seg.activo{ background:var(--rb-azul); border-color:var(--rb-azul); color:var(--rb-blanco); }
  .clave-box{ background:var(--rb-naranja-10); border-left:4px solid var(--rb-naranja); border-radius:8px; padding:12px 16px; font-size:.92rem; color:var(--rb-texto); }
  .clave-box .clave{ font-family:Consolas, monospace; font-size:1.1rem; font-weight:700; margin:6px 0; user-select:all; }

  /* ---------- Avisos flotantes ---------- */
  .toast-stack{ position:fixed; right:20px; bottom:28px; display:flex; flex-direction:column; gap:8px; z-index:100; max-width:380px; }
  .toast-stack .rb-alerta{ background:var(--rb-superficie); box-shadow:var(--rb-sombra); animation:aparecer .18s ease; }
  @keyframes aparecer{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

  /* ---------- Vacío ---------- */
  .vacio{ text-align:center; padding:56px 20px; color:var(--rb-texto-2); }
  .vacio h3{ color:var(--rb-texto); margin-bottom:6px; }
  .rb-pie{ max-width:var(--ancho-app); margin:0 auto; width:100%; }


  /* ---------- Tablero por días ---------- */
  .wgrid.dias td.celda{ width:38px; min-width:38px; font-size:.76rem; }
  .wgrid.dias td.celda span{ padding:7px 2px; }
  .wgrid.dias thead th.dia{ font-size:.7rem; font-weight:700; padding:3px 2px; line-height:1.1; }
  .wgrid.dias thead th.dia small{ display:block; font-weight:400; color:var(--rb-azul-20); font-size:.66rem; }
  .wgrid.dias thead th.dia.fin{ background:var(--rb-azul-80); color:var(--rb-azul-20); }
  .wgrid.dias thead th.dia.fest{ background:var(--rb-naranja); color:var(--rb-blanco); }
  .wgrid.dias thead th.dia.fest small{ color:var(--rb-blanco); }
  .wgrid.dias thead th.dia.hoy{ box-shadow:inset 0 -3px 0 var(--rb-jade); }
  .wgrid.dias thead th.sem{ text-align:left; padding:5px 8px; font-size:.78rem; white-space:nowrap; }
  .wgrid.dias thead th.sem .sec-h{ font-weight:400; color:var(--rb-azul-20); font-size:.7rem; }
  .wgrid.dias thead th.sem svg{ width:13px; height:13px; vertical-align:-2px; margin-right:4px; color:var(--rb-naranja); }
  .wgrid.dias thead th.sem.sobre-h{ background:var(--rb-azul-oscuro); color:var(--rb-naranja-60); }
  .wgrid.dias thead th.sem.sobre-h .sec-h{ color:var(--rb-naranja-40); }
  .wgrid.dias thead th.sigma{ font-size:.75rem; background:var(--rb-azul-80); }
  .wgrid td.celda.fin{ background:var(--rb-gris-10); color:var(--rb-gris); }
  .wgrid td.celda.fest{ background:var(--rb-naranja-10); color:var(--rb-naranja-80); }
  .wgrid td.celda.fin.ph-previas, .wgrid td.celda.fin.ph-planeacion, .wgrid td.celda.fin.ph-ejecucion, .wgrid td.celda.fin.ph-cierre, .wgrid td.celda.fin.ph-informe, .wgrid td.celda.fin.ph-compensatorio, .wgrid td.celda.fin.ph-especiales, .wgrid td.celda.fin.ph-none,
  .wgrid td.celda.fest.ph-previas, .wgrid td.celda.fest.ph-planeacion, .wgrid td.celda.fest.ph-ejecucion, .wgrid td.celda.fest.ph-cierre, .wgrid td.celda.fest.ph-informe, .wgrid td.celda.fest.ph-compensatorio, .wgrid td.celda.fest.ph-especiales, .wgrid td.celda.fest.ph-none{ color:var(--rb-texto); outline:2px dashed var(--rb-naranja); outline-offset:-2px; }
  .wgrid td.celda.hoy{ box-shadow:inset 0 0 0 2px var(--rb-jade); }
  .wgrid td.sigma{ width:44px; min-width:44px; text-align:center; font-weight:700; background:var(--rb-azul-10); color:var(--rb-texto); border-right:2px solid var(--rb-borde); }
  .wgrid td.sigma span{ display:block; padding:7px 3px; }
  .wgrid td.sigma.sobre{ background:var(--rb-naranja); color:var(--rb-blanco); }
  .wgrid tr.grupo td{ position:sticky; left:0; background:var(--rb-jade-10); color:var(--rb-texto); font-weight:700; font-size:.8rem; letter-spacing:.02em; padding:6px 12px; border-bottom:1px solid var(--rb-jade-40); z-index:1; }
  .lg-fin{ background:var(--rb-gris-20); } .lg-fest{ background:var(--rb-naranja-20); outline:2px dashed var(--rb-naranja); outline-offset:-2px; }

  /* Días en miniatura dentro de la tarjeta semanal */
  .linea{ grid-template-columns:minmax(0,1fr) auto auto; row-gap:6px; }

  .dias-mini{ display:flex; gap:3px; grid-column:1 / -1; }

  .dias-mini .dm b{ font-size:.7rem; font-weight:700; min-height:.7rem; }
  .dias-mini .dm.fin{ background:var(--rb-gris-20); }
  .dias-mini .dm.fest{ background:var(--rb-naranja-10); color:var(--rb-naranja-80); }
  .dias-mini .dm.con{ color:var(--rb-texto); }
  .dias-mini .dm.con.ph-none{ background:var(--ph-none); }
  .dias-mini .dm.hoy{ box-shadow:inset 0 0 0 2px var(--rb-jade); }
  .persona-card.sobre{ border-color:var(--rb-naranja); }
  .aviso-sobre{ display:flex; align-items:center; gap:8px; background:var(--rb-naranja-10); color:var(--rb-texto); border-left:4px solid var(--rb-naranja); border-radius:6px; padding:6px 10px; font-size:.82rem; font-weight:700; }
  .aviso-sobre svg{ width:15px; height:15px; color:var(--rb-naranja); flex:none; }
  .sede{ display:inline-block; padding:2px 10px; border-radius:var(--rb-radio-pildora); font-size:.75rem; font-weight:700; color:var(--rb-texto); }
  .sede.a{ background:var(--rb-turquesa-20); } .sede.b{ background:var(--rb-jade-20); }

  /* Editor de días (modal) */
  .dias-ed{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .dia-ed{ display:flex; flex-direction:column; gap:4px; border:1px solid var(--rb-gris-40); border-radius:8px; padding:6px; background:var(--rb-blanco); }
  .dia-ed .n{ font-size:.72rem; font-weight:700; color:var(--rb-texto); text-align:center; line-height:1.2; }
  .dia-ed .n small{ font-weight:400; color:var(--rb-texto-2); }
  .dia-ed .n em{ display:block; font-style:normal; font-size:.6rem; color:var(--rb-naranja); }
  .dia-ed.fin{ background:var(--rb-gris-10); }
  .dia-ed.fest{ background:var(--rb-naranja-10); border-color:var(--rb-naranja-40); }
  .dia-ed .rb-input{ padding:6px 4px; text-align:center; font-size:.9rem; }
  @media (max-width:640px){ .dias-ed{ grid-template-columns:repeat(4,1fr); } }

  @media (max-width: 880px){
    .rb-header{ flex-wrap:wrap; }
